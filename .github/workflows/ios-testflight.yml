# Build iOS et envoi sur TestFlight, lancé à la main (onglet Actions > iOS TestFlight > Run workflow).
# 1. Unity (image GameCI, Linux) génère le projet Xcode.
# 2. Un Mac GitHub archive, signe (signature automatique via la clé App Store Connect) et envoie.
# Secrets à créer dans le dépôt : voir docs/publication-ios-testflight.md.
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  # Même version que l'éditeur utilisé en local (image GameCI disponible).
  UNITY_VERSION: 6000.6.3f1

jobs:
  unity:
    name: Projet Xcode (Unity)
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets Apple (échec immédiat s'il en manque)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent ou vide (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      # Dossiers supprimés en parallèle : ≈ 1 min, contre ≈ 6 avec l'action free-disk-space.
      - name: Libérer de l'espace disque (image Unity volumineuse)
        run: bash ci/free-disk-space.sh

      # Unity tourne dans un conteneur limité à ~7,5 Go sur une machine sans mémoire d'échange :
      # un pic de mémoire (compilation, IL2CPP) le fait tuer par le système (code 137).
      # Un fichier d'échange donne de la marge ; le conteneur Docker peut l'utiliser.
      - name: Ajouter de la mémoire d'échange (évite le code 137)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          # v2 : le Library sauvé par le run 21 (iOS) fait tuer Unity au chargement des scripts
          # (code 137, mémoire libre) ; même symptôme qu'avec le cache Android dans la
          # compilation Unity. Repartir d'un Library neuf.
          key: Library-iOS-v2-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-iOS-v2-

      # Un Library restauré du cache fait parfois tuer Unity au chargement des scripts
      # (code 137, mémoire libre) : en cas d'échec, un second essai repart sans Library.
      - name: Build Unity iOS
        id: unity
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: PuffyBird
          buildMethod: PuffyBird.Editor.BuildScript.BuildIOS
          versioning: None
          customParameters: -buildNumber ${{ github.run_number }} -appleTeamId ${{ secrets.APPLE_TEAM_ID }}

      - name: Repartir sans le cache Library
        if: steps.unity.outcome == 'failure'
        run: sudo rm -rf Library

      - name: Build Unity iOS (second essai)
        if: steps.unity.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: PuffyBird
          buildMethod: PuffyBird.Editor.BuildScript.BuildIOS
          versioning: None
          customParameters: -buildNumber ${{ github.run_number }} -appleTeamId ${{ secrets.APPLE_TEAM_ID }}

      # Code 137 = Unity tué par le système : dire si c'est la mémoire ou le disque.
      - name: Diagnostic machine (en cas d'échec)
        if: failure()
        run: |
          free -m
          df -h / /home/runner/work
          sudo dmesg | grep -iE 'out of memory|killed process|oom' | tail -n 20 || true

      # Archive tar : conserve les droits d'exécution des scripts du projet Xcode.
      - name: Empaqueter le projet Xcode
        run: sudo tar -czf xcode-project.tgz -C build/iOS PuffyBird

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 3

  testflight:
    name: Archive, signature et envoi TestFlight
    needs: unity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Apple exige le SDK iOS le plus récent pour tout envoi : dernier Xcode stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Extraire le projet Xcode
        run: |
          mkdir -p build
          tar -xzf xcode-project.tgz -C build

      - name: Clé API App Store Connect
        env:
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPSTORE_P8" > "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # Archive non signée : la signature automatique de l'archive demanderait un profil de
      # développement, impossible sans appareil enregistré. La signature Distribution se fait
      # à l'export (étape suivante), via la clé API.
      # Le SDK pub (LevelPlay) arrive par CocoaPods : le résolveur de dépendances de Unity écrit
      # le Podfile sous Linux, mais l'installation des pods ne peut se faire que sur macOS.
      # Les minutes Mac coûtent environ 10 fois plus que les minutes Linux sur le
      # quota GitHub : les pods (identiques d'un build à l'autre) sont mis en cache.
      # Sans ~/.cocoapods : ce cache (run 23) bloquait la restauration plus de 25 min (run 24)
      # sans raccourcir pod install. Téléchargement limité à 3 min, sinon build sans cache.
      - name: Cache des pods
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: |
            build/PuffyBird/Pods
            build/PuffyBird/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: pods-v3-${{ hashFiles('build/PuffyBird/Podfile') }}
          restore-keys: pods-v3-

      - name: Pods CocoaPods (SDK pub)
        working-directory: build/PuffyBird
        run: |
          if [ -f Podfile ]; then
            # Sans mise à jour de l'index d'abord (rapide avec le cache), avec sinon.
            pod install || pod install --repo-update
          else
            echo "::warning::Pas de Podfile dans le projet Xcode : le SDK pub LevelPlay ne sera pas lié."
          fi

      - name: Archive
        run: |
          if [ -d build/PuffyBird/Unity-iPhone.xcworkspace ]; then
            PROJECT_ARGS=(-workspace build/PuffyBird/Unity-iPhone.xcworkspace)
          else
            PROJECT_ARGS=(-project build/PuffyBird/Unity-iPhone.xcodeproj)
          fi
          xcodebuild archive \
            "${PROJECT_ARGS[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PuffyBird.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Envoi sur App Store Connect (TestFlight)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          sed "s/__TEAM_ID__/${TEAM_ID}/" ci/ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PuffyBird.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Build ${{ github.run_number }} envoyé : il apparaît dans TestFlight après le traitement par Apple."

      - name: Journaux de distribution Xcode (en cas d'échec)
        if: failure()
        run: |
          for f in "$TMPDIR"/*.xcdistributionlogs/*.log; do
            echo "=== $f ==="
            tail -n 60 "$f"
          done

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
